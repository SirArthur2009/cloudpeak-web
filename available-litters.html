<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse current and upcoming Labrador litters at Cloud Peak Silver Labradors." />
  <title>Available Litters — Cloud Peak Silver Labradors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
</head>
<body>

<div id="site-header"></div>

<nav aria-label="Breadcrumb" class="breadcrumb">
  <div class="container">
    <a href="index.html">Home</a><span>›</span>Available litters
  </div>
</nav>

<section class="hero">
  <div class="container">
    <h1>Available litters</h1>
    <p>Browse current and upcoming litters. Updated in real time as puppies are placed.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="litters-container">
      <div class="loading-state">
        <i class="ti ti-loader" aria-hidden="true"></i>
        Loading litters...
      </div>
    </div>
  </div>
</section>

<section class="cta-section section">
  <div class="container">
    <h2>Don't see what you're looking for?</h2>
    <p>Join the waitlist and we'll notify you when new litters become available.</p>
    <div class="hero-btns">
      <a href="waitlist.html" class="btn btn-primary">Join the waitlist</a>
      <a href="apply.html" class="btn btn-secondary">Puppy application</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<div class="toast" id="toast" role="alert" aria-live="polite"></div>
<script src="js/supabase.js"></script>
<script>
async function loadLitters() {
  const container = document.getElementById('litters-container');
  try {
    const [littersRaw, puppies] = await Promise.all([
      db.select('litters', 'select=*&order=created_at.desc'),
      db.select('puppies', 'select=id,litter_id,status,color,gender,name,collar_color,photo_url')
    ]);

    // Sort: upcoming first, then available/limited by newest date, then placed last
    const statusOrder = { upcoming: 0, available: 1, limited: 2, placed: 3 };
    const litters = (littersRaw || []).sort((a, b) => {
      const aDiff = (statusOrder[a.status] ?? 1) - (statusOrder[b.status] ?? 1);
      if (aDiff !== 0) return aDiff;
      // Within same status, newest date first
      const aDate = a.born_date || a.expected_date || a.created_at || '';
      const bDate = b.born_date || b.expected_date || b.created_at || '';
      return bDate.localeCompare(aDate);
    });

    if (!litters || litters.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:4rem 0;">
          <i class="ti ti-paw" style="font-size:48px;color:var(--grey-mid);display:block;margin-bottom:1rem;" aria-hidden="true"></i>
          <p style="color:var(--grey-text);font-size:15px;margin-bottom:1.5rem;">No litters currently listed. Check back soon or join the waitlist!</p>
          <a href="waitlist.html" class="btn btn-outline">Join the waitlist</a>
        </div>`;
      return;
    }

    container.innerHTML = litters.map(l => {
      const lp = (puppies || []).filter(p => String(p.litter_id) === String(l.id));
      const avail = lp.filter(p => p.status === 'available').length;
      const reserved = lp.filter(p => p.status === 'reserved').length;
      const sold = lp.filter(p => p.status === 'sold').length;
      const status = l.status || getLitterStatus(lp);
      const lName = escapeHtml(l.name);
      const lSire = escapeHtml(l.sire || '—');
      const lDam = escapeHtml(l.dam || '—');
      const lColors = l.colors ? escapeHtml(l.colors) : '';

      if (status === 'upcoming') {
        return `
          <div class="litter-card">
            <div class="litter-header">
              <div class="litter-header-left">
                <h2>${lName}</h2>
                <div class="litter-meta">
                  <span><i class="ti ti-user" aria-hidden="true"></i> ${lSire} × ${lDam}</span>
                  ${l.expected_date ? `<span><i class="ti ti-calendar" aria-hidden="true"></i> Expected ${new Date(l.expected_date).toLocaleDateString()}</span>` : ''}
                  ${lColors ? `<span><i class="ti ti-paw" aria-hidden="true"></i> ${lColors}</span>` : ''}
                </div>
              </div>
              <span class="badge badge-upcoming">Upcoming</span>
            </div>
            <div class="upcoming-body">
              <i class="ti ti-clock" aria-hidden="true"></i>
              <div class="upcoming-text">
                <h3>This litter hasn't arrived yet</h3>
                <p>Join the waitlist to reserve your spot and be notified when puppies are born. <a href="waitlist.html">Join the waitlist →</a></p>
              </div>
            </div>
          </div>`;
      }

      const badgeStatus = avail === 0 ? 'placed' : avail < lp.length ? 'limited' : 'available';
      const badgeLabels = { available: 'Puppies available', limited: 'Limited availability', placed: 'Fully placed' };

      return `
        <div class="litter-card">
          <div class="litter-header">
            <div class="litter-header-left">
              <h2>${lName}</h2>
              <div class="litter-meta">
                <span><i class="ti ti-user" aria-hidden="true"></i> ${lSire} × ${lDam}</span>
                ${l.born_date ? `<span><i class="ti ti-calendar" aria-hidden="true"></i> Born ${new Date(l.born_date).toLocaleDateString()}</span>` : ''}
                ${l.go_home_date ? `<span><i class="ti ti-home" aria-hidden="true"></i> Go home ${new Date(l.go_home_date).toLocaleDateString()}</span>` : ''}
                ${lColors ? `<span><i class="ti ti-paw" aria-hidden="true"></i> ${lColors}</span>` : ''}
              </div>
            </div>
            <span class="badge badge-${badgeStatus}">${badgeLabels[badgeStatus]}</span>
          </div>
          ${avail === 0 ? `
            <div class="fully-placed-note">
              <i class="ti ti-circle-check" aria-hidden="true"></i>
              All puppies in this litter have been placed. View the gallery to see their weekly growth photos.
            </div>` : ''}
          <div class="litter-body">
            ${lp.length > 0 ? `
              <div class="puppy-grid">
                ${lp.map(p => {
                  const pName = escapeHtml(p.name || ((p.color || '') + ' ' + (p.gender || '')));
                  const pGender = escapeHtml(p.gender || '');
                  const pColor = escapeHtml(p.color || '');
                  const pStatus = escapeHtml(p.status);
                  return `
                  <div class="puppy-pill ${pStatus}">
                    <span class="collar-dot" style="background:${collarHex(p.color || p.collar_color || '')}"></span>
                    <div class="puppy-pill-info">
                      <div class="puppy-pill-name">${pName}</div>
                      <div class="puppy-pill-sub">${pGender} ${pColor}</div>
                      <div class="puppy-pill-status ${p.status === 'available' ? 'avail' : pStatus}">${pStatus}</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>` : ''}
            <div class="litter-footer">
              <div class="avail-count">
                ${lp.length > 0
                  ? avail > 0
                    ? `<strong>${avail} available</strong>${reserved > 0 ? `, ${reserved} reserved` : ''}${sold > 0 ? `, ${sold} sold` : ''} — ${lp.length} total`
                    : `All <strong>${lp.length}</strong> puppies placed`
                  : 'Puppy details coming soon'}
              </div>
              <div class="litter-btns">
                <a href="gallery.html" class="btn btn-outline btn-sm">View gallery</a>
                ${avail > 0 ? `<a href="apply.html" class="btn btn-dark btn-sm">Apply now</a>` : ''}
              </div>
            </div>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    container.innerHTML = `<div class="error-state"><i class="ti ti-alert-circle"></i> Couldn't load litters right now. Please try again shortly.</div>`;
  }
}
loadLitters();
</script>
</body>
</html>
